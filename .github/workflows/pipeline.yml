name: pipeline

# AIDEV-NOTE: GITHUB_TOKEN in Actions is limited to ~1k req/hr — not enough for a
# full 1393-repo refresh. GH_TOKEN secret is set (OAuth token via `gh auth token`, 5k/hr);
# GITHUB_TOKEN fallback keeps small/incremental runs working.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: ./target/release/scorecards seed
      - run: ./target/release/scorecards collect
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      - run: ./target/release/scorecards score
      - run: ./target/release/scorecards render
      # AIDEV-NOTE: pi list is small (~75 repos) — negligible next to neovim's budget.
      - run: ./target/release/scorecards seed --category pi
      - run: ./target/release/scorecards collect --category pi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      - run: ./target/release/scorecards score --category pi
      - run: ./target/release/scorecards render --category pi
      # AIDEV-NOTE: monetized repos.yaml is hand-committed (see config/weights.toml) —
      # no seed step; ~1.1k repos may exceed the 5k/hr PAT budget, resumable cache
      # lets collect finish over consecutive nights.
      - run: ./target/release/scorecards collect --category monetized
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      - run: ./target/release/scorecards score --category monetized
      - run: ./target/release/scorecards render --category monetized
      # AIDEV-NOTE: herdr list is huge (~2085 repos ≈ 23k API calls) — one nightly run
      # only inches forward; cache makes collect resumable, local collect-loop.sh does
      # the bulk backfill.
      - run: ./target/release/scorecards seed --category herdr
      - run: ./target/release/scorecards collect --category herdr
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      - run: ./target/release/scorecards score --category herdr
      - run: ./target/release/scorecards render --category herdr
      - name: Commit refreshed data
        run: |
          git config user.name "scorecards-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: nightly refresh $(date -u +%F)"
          # AIDEV-NOTE: manual pushes can land between checkout and here — rebase or push 403s (2026-09-27)
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: pipeline
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
