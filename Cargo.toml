[package]
name = "scorecards"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
octocrab = "0.54.1"
pulldown-cmark = "0.13.4"
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tera = { version = "2.1.1", features = ["glob_fs"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
url = "2.5.8"
