<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Open Source Scorecards{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Maintenance-health scorecards for open source projects — commit activity, release cadence, issue response, CI, and tests. Refreshed nightly from the GitHub API.{% endblock %}">
  <meta property="og:title" content="{% block og_title %}Open Source Scorecards{% endblock %}">
  <meta property="og:description" content="Which open source plugins are actually maintained? Scores from commit activity, releases, issue response, CI, and tests — not stars.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://gtheys.github.io/opensource-scorecards/assets/logo-512.png">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/png" href="{{ root }}assets/favicon.png">
  <style>
    /* AIDEV-NOTE: palette aligned to the logo (navy badge, green checks, gold A+). */
    @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap");
    :root {
      --accent: #187a45;
      --accent-soft: #edf7f0;
      --navy: #101827;
      --navy-soft: #1f2a3d;
      --gold: #f0b429;
      --muted: #667069;
      --line: #e6eae7;
      --bg: #ffffff;
      --fg: #202923;
      --mono: "IBM Plex Mono", "SF Mono", Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #3fbf7f;
        --accent-soft: #14251c;
        --muted: #8b968f;
        --line: #26302a;
        --bg: #12171a;
        --fg: #dde4de;
      }
      body { background: var(--bg); }
      th { background: var(--bg) !important; }
      .hero-band { background: var(--navy) !important; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--fg); background: var(--bg);
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--accent-soft); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .site-header { border-bottom: 1px solid var(--line); }
    .header-inner, .page-shell { width: min(1200px, 100% - 3rem); margin-inline: auto; }
    .header-inner { display: flex; justify-content: space-between; align-items: center; gap: 20px; height: 72px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 700; letter-spacing: -.045em; color: var(--fg); }
    .brand:hover { text-decoration: none; }
    .brand img { width: 32px; height: 32px; border-radius: 8px; }
    nav { display: flex; align-items: center; gap: 24px; font-size: .875rem; font-weight: 500; }
    nav a { color: var(--muted); }
    nav a:hover { color: var(--accent); text-decoration: none; }
    .page-shell { padding: 40px 0 64px; }
    h1 { margin: 0; font-size: clamp(1.8rem, 3.5vw, 2.6rem); font-weight: 650; letter-spacing: -.055em; line-height: 1.15; }
    h2 { font-size: 1.15rem; font-weight: 600; letter-spacing: -.03em; }
    table { border-collapse: collapse; width: 100%; margin-top: 1.5rem; }
    th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--line); font-size: .92rem; }
    th { position: sticky; top: 0; background: var(--bg); color: var(--muted); font-size: .78rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
    tbody tr:hover { background: var(--accent-soft); }
    td a[href*="projects/"], td a[href*="authors/"] { font-family: var(--mono); font-size: .86rem; letter-spacing: -.02em; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .bar { display: inline-block; width: 6rem; height: .55rem; background: var(--line); border-radius: 3px; vertical-align: middle; }
    .bar .fill { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
    /* A+ tier: top-3 rows get the logo's gold */
    tr.top-tier .bar .fill { background: var(--gold); }
    tr.top-tier td:first-child { font-weight: 700; }
    .notice { padding: .8rem 1rem; background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; font-size: .92rem; }
    .muted { color: var(--muted); }
    .avatar { border-radius: 50%; vertical-align: middle; }
    /* Hub hero */
    .hero-band { background: var(--navy); color: #f3f5f7; }
    .hero-inner { width: min(1200px, 100% - 3rem); margin-inline: auto; padding: 56px 0 48px; }
    .hero-inner h1 { color: #fff; max-width: 21ch; }
    .hero-sub { max-width: 62ch; font-size: 1.05rem; color: #c3cbd6; margin: 14px 0 26px; }
    .hero-sub strong { color: #fff; }
    .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn { display: inline-block; padding: .65rem 1.2rem; border-radius: 8px; font-weight: 600; font-size: .95rem; }
    .btn:hover { text-decoration: none; opacity: .92; }
    .btn-primary { background: var(--gold); color: #1a1405; }
    .btn-ghost { border: 1px solid #3a4657; color: #e6eaf0; }
    /* Hub cards */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin: 1.5rem 0; }
    .card { border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem 1.2rem; display: block; color: var(--fg); }
    .card:hover { border-color: var(--accent); text-decoration: none; background: var(--accent-soft); }
    .card h2 { margin: 0 0 .3rem; }
    .card .count { font-size: 1.6rem; font-weight: 700; letter-spacing: -.03em; }
    .card .top { font-family: var(--mono); font-size: .82rem; margin-top: .4rem; }
    .pillars { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin: 1.5rem 0; }
    .pillar { border-left: 3px solid var(--accent); padding-left: .9rem; font-size: .93rem; }
    .pillar strong { display: block; margin-bottom: .2rem; }
    footer { border-top: 1px solid var(--line); margin-top: 3rem; padding-top: 1.2rem; font-size: .8rem; }
    footer a { text-decoration: underline; }
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ root }}index.html"><img src="{{ root }}assets/logo-192.png" alt="">Scorecards</a>
    <nav>{% for c in categories %}<a href="{{ root }}{{ c.key }}.html">{{ c.name }}</a>{% endfor %}<a href="{{ root }}methodology.html">Methodology</a><a href="https://github.com/gtheys/opensource-scorecards">GitHub</a></nav>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<div class="page-shell">
<footer class="muted">Scores measure maintenance likelihood, not code quality. <a href="{{ root }}methodology.html">How scores work</a>.</footer>
</div>
</body>
</html>
